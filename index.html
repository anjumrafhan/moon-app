<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Chat App</title>

  <!-- ===== PWA (Add to Home Screen) ===== -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#075e54" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chat App" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      background: #d9dbd4;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 400px;
      height: 90vh;
      max-height: 700px;
      background: #efeae2;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      background: white;
      align-self: flex-start;
      word-wrap: break-word;
    }

    .message.mine {
      align-self: flex-end;
      background: #dcf8c6;
    }

    .message .sender {
      font-size: 12px;
      color: #075e54;
      font-weight: bold;
      display: block;
      margin-bottom: 2px;
    }

    /* message ke neeche chhota time */
    .message .time {
      font-size: 10px;
      color: #999;
      display: block;
      text-align: right;
      margin-top: 3px;
    }

    .typing {
      font-size: 12px;
      color: #888;
      padding: 0 15px 5px;
      height: 18px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #f0f0f0;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }

    .input-area button {
      background: #075e54;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">My Chat App</div>
    <div class="messages" id="messages"></div>
    <div class="typing" id="typing"></div>
    <div class="input-area">
      <input id="input" type="text" placeholder="Message likhein..." autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const username = prompt("Apna naam likhein:") || "Anonymous";

    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const typingDiv = document.getElementById("typing");

    // Time ko aasan shakal mein dikhane wala helper
    function formatTime(t) {
      if (!t) return "";
      const d = new Date(t);
      return d.getHours().toString().padStart(2, "0") + ":" +
             d.getMinutes().toString().padStart(2, "0");
    }

    // Ek message ko screen par dikhane wala function
    function addMessage(data) {
      const div = document.createElement("div");
      div.classList.add("message");

      const timeText = `<span class="time">${formatTime(data.time)}</span>`;

      if (data.user === username) {
        div.classList.add("mine");
        div.innerHTML = data.text + timeText;
      } else {
        div.innerHTML = `<span class="sender">${data.user}</span>${data.text}${timeText}`;
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // ---- Message bhejna ----
    function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;
      socket.emit("chat message", { user: username, text: text });
      input.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
      else socket.emit("typing", username);
    });

    // ---- PURANE MESSAGES (database se) jab app khule ----
    socket.on("load messages", (oldMessages) => {
      oldMessages.forEach(addMessage);
    });

    // ---- Naya message aana ----
    socket.on("chat message", (data) => {
      typingDiv.textContent = "";
      addMessage(data);
    });

    // ---- typing... ----
    let typingTimeout;
    socket.on("typing", (name) => {
      typingDiv.textContent = name + " type kar raha hai...";
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { typingDiv.textContent = ""; }, 1500);
    });
  </script>
</body>
</html>
