<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Chat App</title>

  <!-- ===== PWA (Add to Home Screen) ===== -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#075e54" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chat App" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      background: #d9dbd4;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(900px, 96vw);
      height: 92vh;
      max-height: 760px;
      background: #efeae2;
      display: flex;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    /* ---------- SIDEBAR (contacts) ---------- */
    .sidebar {
      width: 300px;
      background: #fff;
      border-right: 1px solid #e2e2e2;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      background: #075e54;
      color: #fff;
      padding: 16px 15px;
      font-size: 17px;
      font-weight: bold;
    }
    .sidebar-header small {
      display: block;
      font-weight: normal;
      font-size: 12px;
      opacity: .85;
      margin-top: 2px;
    }

    .contacts {
      flex: 1;
      overflow-y: auto;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid #f1f1f1;
    }
    .contact:hover { background: #f5f5f5; }
    .contact.active { background: #ebebeb; }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #075e54;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    .c-meta { flex: 1; min-width: 0; }
    .c-name { font-weight: bold; font-size: 15px; color: #111; }
    .c-status { font-size: 12px; color: #888; }
    .c-status.online { color: #25d366; }

    .badge {
      background: #25d366;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-contacts {
      padding: 20px 16px;
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ---------- CHAT AREA ---------- */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 12px 15px;
      font-size: 17px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header .back {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }
    .chat-header small {
      display: block;
      font-weight: normal;
      font-size: 12px;
      opacity: .85;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #efeae2;
    }

    .message {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 8px;
      background: white;
      align-self: flex-start;
      word-wrap: break-word;
      box-shadow: 0 1px 1px rgba(0,0,0,.08);
    }
    .message.mine {
      align-self: flex-end;
      background: #dcf8c6;
    }
    .message .time {
      font-size: 10px;
      color: #999;
      display: block;
      text-align: right;
      margin-top: 3px;
    }

    /* typing... line */
    .typing {
      font-size: 12px;
      color: #888;
      padding: 0 15px 5px;
      height: 18px;
      background: #efeae2;
    }

    .placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      text-align: center;
      padding: 20px;
      background: #efeae2;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #f0f0f0;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }
    .input-area input:disabled { background: #e9e9e9; }
    .input-area button {
      background: #075e54;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }
    .input-area button:disabled { opacity: .5; cursor: not-allowed; }

    /* ---------- MOBILE ---------- */
    @media (max-width: 600px) {
      body { align-items: stretch; justify-content: stretch; }
      .app { width: 100%; height: 100vh; max-height: none; border-radius: 0; }
      .sidebar { width: 100%; }
      .chat { display: none; }
      /* jab chat khuli ho: sidebar chhupao, chat dikhao */
      .app.show-chat .sidebar { display: none; }
      .app.show-chat .chat { display: flex; }
      .chat-header .back { display: inline; }
    }
  </style>
</head>
<body>

  <div class="app" id="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        Chats
        <small id="myName">—</small>
      </div>
      <div class="contacts" id="contacts"></div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat">
      <div class="chat-header">
        <button class="back" id="back" title="Wapas">&larr;</button>
        <div>
          <span id="chatName">My Chat App</span>
          <small id="chatStatus"></small>
        </div>
      </div>

      <!-- jab tak koi contact select na ho -->
      <div class="placeholder" id="placeholder">
        Baat shuru karne ke liye baayein se kisi contact ko chunein.
      </div>

      <!-- messages (chat khulne par dikhega) -->
      <div class="messages" id="messages" style="display:none;"></div>

      <!-- typing... (chat khulne par dikhega) -->
      <div class="typing" id="typing" style="display:none;"></div>

      <div class="input-area">
        <input id="input" type="text" placeholder="Message likhein..." autocomplete="off" disabled />
        <button id="send" disabled>Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // ---- Apna naam ----
    let me = (prompt("Apna naam likhein:") || "Anonymous").trim() || "Anonymous";
    document.getElementById("myName").textContent = me;
    socket.emit("register", me);

    // ---- State ----
    let currentChat = null;     // jis se abhi baat ho rahi hai
    let lastList = [];          // server se aayi taaza user list
    const unread = {};          // username -> kitne unread messages
    const userInfo = {};        // username -> { online }
    let lastTypingSent = 0;     // typing event throttle ke liye

    // ---- DOM ----
    const app          = document.getElementById("app");
    const contactsEl   = document.getElementById("contacts");
    const messagesEl   = document.getElementById("messages");
    const placeholder  = document.getElementById("placeholder");
    const typingDiv    = document.getElementById("typing");
    const inputEl      = document.getElementById("input");
    const sendBtn      = document.getElementById("send");
    const chatName     = document.getElementById("chatName");
    const chatStatus   = document.getElementById("chatStatus");
    const backBtn      = document.getElementById("back");

    // ---- Helpers ----
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    function formatTime(t) {
      if (!t) return "";
      const d = new Date(t);
      return d.getHours().toString().padStart(2, "0") + ":" +
             d.getMinutes().toString().padStart(2, "0");
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ---- Contacts list dikhao ----
    function renderContacts() {
      contactsEl.innerHTML = "";
      const others = lastList.filter(u => u.username !== me);

      if (others.length === 0) {
        contactsEl.innerHTML =
          '<div class="empty-contacts">Abhi koi doosra user nahi mila.<br><br>' +
          'Doosri window / phone par yahi app khol kar koi aur naam register karein, ' +
          'phir wo yahan nazar aaye ga.</div>';
        return;
      }

      others.forEach(u => {
        userInfo[u.username] = u;
        const item = document.createElement("div");
        item.className = "contact" + (u.username === currentChat ? " active" : "");
        item.onclick = () => openChat(u.username);

        const count = unread[u.username] || 0;
        const badge = count ? `<span class="badge">${count}</span>` : "";

        item.innerHTML =
          `<div class="avatar">${escapeHtml(u.username.charAt(0).toUpperCase())}</div>
           <div class="c-meta">
             <div class="c-name">${escapeHtml(u.username)}</div>
             <div class="c-status ${u.online ? "online" : ""}">${u.online ? "online" : "offline"}</div>
           </div>
           ${badge}`;
        contactsEl.appendChild(item);
      });
    }

    // ---- Kisi contact ke saath chat kholo ----
    function openChat(user) {
      currentChat = user;
      unread[user] = 0;

      chatName.textContent = user;
      chatStatus.textContent = (userInfo[user] && userInfo[user].online) ? "online" : "offline";

      messagesEl.innerHTML = "";
      messagesEl.style.display = "flex";
      placeholder.style.display = "none";
      typingDiv.style.display = "block";
      typingDiv.textContent = "";

      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();

      app.classList.add("show-chat");   // mobile par chat dikhao
      renderContacts();                 // active highlight + badge clear

      socket.emit("load conversation", user);
    }

    // ---- Ek message screen par lagao ----
    function addMessage(data) {
      const div = document.createElement("div");
      div.className = "message" + (data.from === me ? " mine" : "");
      div.innerHTML = escapeHtml(data.text) +
                      `<span class="time">${formatTime(data.time)}</span>`;
      messagesEl.appendChild(div);
    }

    // ---- Message bhejna ----
    function sendMessage() {
      const text = inputEl.value.trim();
      if (text === "" || !currentChat) return;
      socket.emit("private message", { to: currentChat, text: text });
      inputEl.value = "";
      // Note: server khud wapas bhejta hai, isliye yahan add nahi karte.
    }

    sendBtn.addEventListener("click", sendMessage);

    // Enter se bhejo
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
    });

    // Likhte waqt doosre bande ko "typing" batao (har 600ms mein zyada se zyada ek baar)
    inputEl.addEventListener("input", () => {
      if (!currentChat) return;
      const now = Date.now();
      if (now - lastTypingSent > 600) {
        socket.emit("typing", { to: currentChat });
        lastTypingSent = now;
      }
    });

    backBtn.addEventListener("click", () => app.classList.remove("show-chat"));

    // ================== SERVER SE AANE WALE EVENTS ==================

    // 1) Contacts list (online flag ke saath)
    socket.on("user list", (list) => {
      lastList = list;
      // agar khuli chat wale ka status badla ho to update karo
      if (currentChat) {
        const u = list.find(x => x.username === currentChat);
        chatStatus.textContent = (u && u.online) ? "online" : "offline";
      }
      renderContacts();
    });

    // 2) Purani baat-cheet (jab contact kholte ho)
    socket.on("conversation", (payload) => {
      if (payload.withUser !== currentChat) return;   // sirf khuli chat ke liye
      messagesEl.innerHTML = "";
      payload.messages.forEach(addMessage);
      scrollBottom();
    });

    // 3) Naya private message (apna ya doosre ka)
    socket.on("private message", (data) => {
      // is message ka "doosra banda" kaun hai?
      const other = (data.from === me) ? data.to : data.from;

      if (other === currentChat) {
        typingDiv.textContent = "";   // message aa gaya to typing hatao
        addMessage(data);
        scrollBottom();
      } else {
        // doosri chat ka message -> unread badge barhao
        unread[other] = (unread[other] || 0) + 1;
        renderContacts();
      }
    });

    // 4) Typing indicator (sirf khuli chat wale ka dikhao)
    let typingTimeout;
    socket.on("typing", (data) => {
      if (data.from !== currentChat) return;
      typingDiv.textContent = data.from + " type kar raha hai...";
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { typingDiv.textContent = ""; }, 1500);
    });
  </script>
</body>
</html>
