<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Chat App</title>

  <!-- ===== PWA (Add to Home Screen) ===== -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#075e54" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chat App" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      background: #d9dbd4;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 400px;
      height: 90vh;
      max-height: 700px;
      background: #efeae2;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header .back {
      cursor: pointer;
      font-size: 22px;
      display: none;   /* sirf conversation view mein dikhega */
    }
    .chat-header .me {
      margin-left: auto;
      font-size: 12px;
      font-weight: normal;
      opacity: 0.85;
    }

    /* ===== Contacts list ===== */
    .contacts { flex: 1; overflow-y: auto; }
    .contact {
      padding: 14px 16px;
      border-bottom: 1px solid #e0ddd5;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
    }
    .contact:hover { background: #f5f3ef; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; }
    .dot.online { background: #25d366; }
    .contact .name { font-size: 15px; }
    .contact .status { font-size: 11px; color: #888; margin-left: auto; }
    .empty-note { padding: 20px; color: #888; font-size: 13px; text-align: center; }

    /* ===== Conversation ===== */
    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: none;          /* shuru mein chhupa hua */
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      background: white;
      align-self: flex-start;
      word-wrap: break-word;
    }
    .message.mine { align-self: flex-end; background: #dcf8c6; }
    .message .time {
      font-size: 10px; color: #999; display: block;
      text-align: right; margin-top: 3px;
    }

    .input-area {
      display: none;          /* sirf conversation view mein */
      padding: 10px;
      background: #f0f0f0;
      gap: 8px;
    }
    .input-area input {
      flex: 1; padding: 10px; border: 1px solid #ccc;
      border-radius: 20px; outline: none;
    }
    .input-area button {
      background: #075e54; color: white; border: none;
      padding: 10px 18px; border-radius: 20px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <span class="back" id="back">&#8592;</span>
      <span id="headerTitle">Chats</span>
      <span class="me" id="meLabel"></span>
    </div>

    <!-- Contacts list (default view) -->
    <div class="contacts" id="contacts"></div>

    <!-- Conversation view -->
    <div class="messages" id="messages"></div>
    <div class="input-area" id="inputArea">
      <input id="input" type="text" placeholder="Message likhein..." autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const myName = (prompt("Apna naam likhein:") || "Anonymous").trim();

    // Server ko apna naam batao (register)
    socket.emit("register", myName);

    // HTML elements
    const contactsDiv = document.getElementById("contacts");
    const messagesDiv = document.getElementById("messages");
    const inputArea = document.getElementById("inputArea");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const backBtn = document.getElementById("back");
    const headerTitle = document.getElementById("headerTitle");
    const meLabel = document.getElementById("meLabel");

    meLabel.textContent = "Aap: " + myName;

    let currentChat = null;   // abhi jis se baat ho rahi hai

    function formatTime(t) {
      if (!t) return "";
      const d = new Date(t);
      return d.getHours().toString().padStart(2, "0") + ":" +
             d.getMinutes().toString().padStart(2, "0");
    }

    // ---- Ek message screen par dikhana ----
    function addMessage(m) {
      const div = document.createElement("div");
      div.classList.add("message");
      const timeText = `<span class="time">${formatTime(m.time)}</span>`;
      if (m.from === myName) div.classList.add("mine");
      div.innerHTML = m.text + timeText;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ---- Contacts list dikhana ----
    function showContactsView() {
      currentChat = null;
      contactsDiv.style.display = "block";
      messagesDiv.style.display = "none";
      inputArea.style.display = "none";
      backBtn.style.display = "none";
      headerTitle.textContent = "Chats";
      meLabel.style.display = "block";
    }

    // ---- Ek bande ke saath conversation kholna ----
    function openChat(username) {
      currentChat = username;
      contactsDiv.style.display = "none";
      messagesDiv.style.display = "flex";
      inputArea.style.display = "flex";
      backBtn.style.display = "block";
      headerTitle.textContent = username;
      meLabel.style.display = "none";
      messagesDiv.innerHTML = "";
      socket.emit("load conversation", username);   // purani baat-cheet mango
    }

    backBtn.addEventListener("click", showContactsView);

    // ---- Server se contacts list aana ----
    socket.on("user list", (users) => {
      contactsDiv.innerHTML = "";
      const others = users.filter((u) => u.username !== myName);
      if (others.length === 0) {
        contactsDiv.innerHTML =
          '<div class="empty-note">Abhi koi aur user nahi. Kisi aur ko link bhej kar naam se join karwayein, phir yahan dikhega.</div>';
        return;
      }
      others.forEach((u) => {
        const div = document.createElement("div");
        div.className = "contact";
        div.innerHTML =
          `<span class="dot ${u.online ? "online" : ""}"></span>` +
          `<span class="name">${u.username}</span>` +
          `<span class="status">${u.online ? "online" : "offline"}</span>`;
        div.addEventListener("click", () => openChat(u.username));
        contactsDiv.appendChild(div);
      });
    });

    // ---- Purani conversation aana ----
    socket.on("conversation", (data) => {
      if (data.withUser !== currentChat) return;
      messagesDiv.innerHTML = "";
      data.messages.forEach(addMessage);
    });

    // ---- Naya private message aana ----
    socket.on("private message", (m) => {
      // Sirf tab dikhao jab yahi conversation khuli ho
      const involvesOpenChat =
        (m.from === currentChat && m.to === myName) ||
        (m.from === myName && m.to === currentChat);
      if (currentChat && involvesOpenChat) addMessage(m);
    });

    // ---- Message bhejna ----
    function sendMessage() {
      const text = input.value.trim();
      if (text === "" || !currentChat) return;
      socket.emit("private message", { to: currentChat, text: text });
      input.value = "";
    }
    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Shuru mein contacts list dikhao
    showContactsView();
  </script>
</body>
</html>
