name: Keep Render App Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          echo "Ping bhej raha hoon: $(date)"
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            https://moon-app-vt2y.onrender.com/ \
            || echo "Ping fail ho gaya (app shayad start ho rahi hai)"
